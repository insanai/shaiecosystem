project = "Shanghai Ecosystem Atlas"
author = "Vikrant Rathore"
copyright = "2026, Vikrant Rathore and contributors"
version = "2026.11"
release = "Research edition 2026-11-04"
language = "en"
root_doc = "index"
source_suffix = [".rst"]
extensions = []
templates_path = ["_templates"]
exclude_patterns = ["_build", "locales", "zh-CN", "downloads", "fonts", "Thumbs.db", ".DS_Store"]
locale_dirs = ["locales"]
gettext_compact = false
html_theme = "guidedog"
html_title = "Shanghai Ecosystem Atlas"
html_short_title = "Shanghai Atlas"
html_static_path = ["_static"]
html_css_files = ["shanghai.css"]
html_js_files = ["atlas/catalog.js", "atlas/geometry.js", "shanghai.js"]
html_extra_path = ["downloads"]
html_show_sourcelink = false
html_show_sphinx = true
html_copy_source = false
numfig = true
pdf_paper_size = "a4"
pdf_logo = "_static/atlas/shanghai-ink-dawn-book.png"
pdf_packages = "download"
pdf_fonts = "embedded"
pdf_font_paths = ["_static/fonts", "fonts"]
pdf_show_urls = "no"

[html_theme_options]
accent = "#315b50"
default_mode = "light"

[html_context]
assembled_site = false
atlas_site_url = "https://bettershanghai.com"
atlas_languages = [
  {code = "en", tag = "en", name = "English", short = "EN", folder = "en"},
  {code = "zh_CN", tag = "zh-CN", name = "简体中文", short = "中文", folder = "zh-CN"},
  {code = "hi", tag = "hi", name = "हिन्दी", short = "हिन्दी", folder = "hi"},
  {code = "ja", tag = "ja", name = "日本語", short = "日本語", folder = "ja"},
  {code = "ko", tag = "ko", name = "한국어", short = "한국어", folder = "ko"},
  {code = "de", tag = "de", name = "Deutsch", short = "DE", folder = "de"},
  {code = "es", tag = "es", name = "Español", short = "ES", folder = "es"},
]

[[pdf_documents]]
root = "index"
file = "shanghai-ecosystem-atlas.pdf"
title = "Shanghai Ecosystem Atlas"
author = "Vikrant Rathore"
