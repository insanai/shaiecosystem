project = "Shanghai Ecosystem Atlas"
author = "Shanghai Ecosystem Atlas"
copyright = "2026, Shanghai Ecosystem Atlas"
version = "2026.11"
release = "Research edition 2026-11-04"
language = "en"
root_doc = "index"
source_suffix = [".rst"]
extensions = []
templates_path = ["_templates"]
exclude_patterns = ["_build", "locales", "zh-CN", "downloads", "Thumbs.db", ".DS_Store"]
locale_dirs = ["locales"]
gettext_compact = false
html_theme = "guidedog"
html_title = "Shanghai Ecosystem Atlas"
html_short_title = "Shanghai Atlas"
html_static_path = ["_static"]
html_css_files = ["shanghai.css"]
html_js_files = ["atlas/catalog.js", "atlas/geometry.js", "shanghai.js"]
html_extra_path = ["downloads"]
html_show_sourcelink = false
html_show_sphinx = true
html_copy_source = false
numfig = true
pdf_paper_size = "a4"
pdf_logo = "_static/atlas/shanghai-ink-cover.png"
pdf_packages = "offline"
pdf_fonts = "system"
pdf_show_urls = "no"

[html_theme_options]
accent = "#315b50"
default_mode = "light"

[[pdf_documents]]
root = "index"
file = "shanghai-ecosystem-atlas.pdf"
title = "Shanghai Ecosystem Atlas"
author = "Shanghai Ecosystem Atlas"
