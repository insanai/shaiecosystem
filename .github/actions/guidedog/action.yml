name: Install Guidedog
# Derived from Guidedog's `guidedog pages workflow` template (v1.0.0-beta.12).
description: Install the checksum-pinned Guidedog publisher with its embedded Typst PDF compiler.
runs:
  using: composite
  steps:
    - name: Install Guidedog 1.0.0-beta.12
      shell: bash
      env:
        GUIDEDOG_VERSION: 1.0.0-beta.12
        GUIDEDOG_SHA256: 26d8abb12889714e1f2840a372851e2582a5fc842dcc18ee0450371581519fba
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/guidedog-linux-amd64.tar.gz"
        url="https://github.com/insanai/guidedog/releases/download/v${GUIDEDOG_VERSION}/guidedog-linux-amd64.tar.gz"
        curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location "$url" -o "$archive"
        printf '%s  %s\n' "$GUIDEDOG_SHA256" "$archive" | sha256sum --check --strict
        mkdir -p "$RUNNER_TEMP/guidedog"
        tar -xzf "$archive" -C "$RUNNER_TEMP/guidedog" --strip-components=1
        echo "$RUNNER_TEMP/guidedog" >> "$GITHUB_PATH"
    - name: Publisher version
      shell: bash
      run: guidedog --version
    - name: Register bundled fonts for Graphviz
      shell: bash
      run: |
        set -euo pipefail
        atlas_font_dir="$HOME/.local/share/fonts/shanghai-atlas"
        mkdir -p "$atlas_font_dir"
        cp docs/fonts/*.otf docs/fonts/*.ttf "$atlas_font_dir/"
        fc-cache -f "$atlas_font_dir"
